<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="toolbar">
      <div class="brand">MUSIC VISUALIZER</div>
      <div class="toolbar-actions">
        <label class="file-button">
          이미지
          <input id="imageInput" type="file" accept="image/*">
        </label>
        <label class="file-button">
          음악
          <input id="audioInput" type="file" accept="audio/*">
        </label>
        <button id="playButton" type="button" disabled>재생</button>
        <button id="exportButton" class="primary" type="button" disabled>영상 추출</button>
      </div>
    </section>

    <section class="workspace">
      <div class="preview-wrap">
        <canvas id="canvas" width="1920" height="1080"></canvas>
      </div>

      <aside class="controls">
        <div class="panel">
          <h2>TEXT</h2>
          <label>제목<input id="titleInput" value="NOW PLAYING"></label>
          <label>아티스트<input id="artistInput" value=""></label>
          <label>설명<input id="subtitleInput" value=""></label>
          <label>폰트
            <select id="fontInput">
              <option value="Inter">Inter</option>
              <option value="Noto Sans KR">Noto Sans KR</option>
              <option value="Georgia">Georgia</option>
              <option value="Arial">Arial</option>
              <option value="serif">Serif</option>
            </select>
          </label>
        </div>

        <div class="panel">
          <h2>VISUAL</h2>
          <label>LP 회전 속도
            <input id="speedInput" type="range" min="0.1" max="2" step="0.05" value="1">
          </label>
          <label>파형 높이
            <input id="waveInput" type="range" min="0.4" max="1.8" step="0.05" value="1">
          </label>
          <label class="check"><input id="autoColorInput" type="checkbox" checked> 이미지 색상 자동 적용</label>
        </div>

        <div class="panel">
          <h2>EXPORT</h2>
          <label>해상도
            <select id="resolutionInput">
              <option value="1920x1080">1920 × 1080</option>
              <option value="1280x720">1280 × 720</option>
              <option value="1080x1080">1080 × 1080</option>
            </select>
          </label>
          <label>출력 형식
            <select id="exportFormatInput">
              <option value="mp4">MP4 (지원 시)</option>
              <option value="webm">WebM</option>
            </select>
          </label>
          <div class="transport"><input id="seekInput" type="range" min="0" max="1000" value="0" step="1" aria-label="재생 위치"><div class="transport-row"><span id="currentTimeLabel">00:00</span><span id="durationLabel">00:00</span></div><label>볼륨<input id="volumeInput" type="range" min="0" max="1" value="1" step="0.01"></label></div><div id="exportStatus" class="status">이미지와 음악을 넣어줘</div>
        </div>
      </aside>
    </section>

    <audio id="audio" crossorigin="anonymous"></audio>
  </main>
  <script src="app.js"></script>
</body>
</html>
